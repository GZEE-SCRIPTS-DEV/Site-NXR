<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloqueados - NXR</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#000;color:#fff;min-height:100vh;}

header{
display:flex;justify-content:space-between;align-items:center;padding:20px 30px;
background:#111827;border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{font-size:30px;font-weight:800;background:linear-gradient(90deg,#c084fc,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.btn-back{
padding:10px 20px;background:rgba(124,58,237,0.1);border:1px solid #7c3aed;
border-radius:10px;color:#c084fc;font-weight:700;cursor:pointer;text-decoration:none;transition:0.3s;
}
.btn-back:hover{background:#7c3aed;color:white;}

.container{max-width:900px;margin:0 auto;padding:40px 20px;}

.page-title{
font-size:42px;font-weight:800;margin-bottom:15px;
background:linear-gradient(90deg,#ef4444,#dc2626);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.page-subtitle{font-size:18px;color:#9ca3af;margin-bottom:40px;}

.blocked-list{display:flex;flex-direction:column;gap:15px;}

.blocked-item{
display:flex;align-items:center;justify-content:space-between;
background:linear-gradient(135deg,rgba(17,24,39,0.98),rgba(2,6,23,0.98));
border-radius:18px;padding:20px 25px;border:1px solid rgba(239,68,68,0.2);
transition:0.3s;
}

.blocked-item:hover{
border-color:#ef4444;box-shadow:0 5px 20px rgba(239,68,68,0.2);
}

.blocked-user{display:flex;align-items:center;gap:15px;flex:1;}

.blocked-avatar{
width:55px;height:55px;border-radius:50%;object-fit:cover;
border:2px solid #ef4444;
}

.blocked-info{}

.blocked-name{font-size:18px;font-weight:700;margin-bottom:4px;}
.blocked-username{font-size:14px;color:#9ca3af;}

.btn-unblock{
padding:12px 24px;background:rgba(34,197,94,0.1);border:1px solid #22c55e;
border-radius:12px;color:#22c55e;font-weight:700;cursor:pointer;transition:0.3s;
}

.btn-unblock:hover{background:#22c55e;color:white;}

.empty-state{
text-align:center;padding:80px 20px;color:#6b7280;
}

.empty-state h3{font-size:24px;margin-bottom:10px;}
.empty-state p{font-size:16px;}

@media(max-width:768px){
.blocked-item{flex-direction:column;gap:15px;}
.btn-unblock{width:100%;}
}
</style>
</head>
<body>

<header>
<div class="logo">NXR</div>
<a href="dashboard.html" class="btn-back">← Voltar</a>
</header>

<div class="container">

<h1 class="page-title">🚫 Usuários Bloqueados</h1>
<p class="page-subtitle">Gerencie os usuários que você bloqueou</p>

<div class="blocked-list" id="blockedList">
<div class="empty-state">
<h3>⏳ Carregando...</h3>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,updateDoc,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
authDomain: "siteoficialgzee.firebaseapp.com",
projectId: "siteoficialgzee",
storageBucket: "siteoficialgzee.firebasestorage.app",
messagingSenderId: "927527396643",
appId: "1:927527396643:web:e1de375c6994d351995896"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, async (user) => {
if(!user){
window.location.href = "login.html";
return;
}
currentUser = user;
loadBlockedUsers();
});

async function loadBlockedUsers(){
const userRef = doc(db,"usuarios",currentUser.uid);
const snap = await getDoc(userRef);

const list = document.getElementById('blockedList');
list.innerHTML = '';

if(!snap.exists() || !snap.data().bloqueados || snap.data().bloqueados.length === 0){
list.innerHTML = `
<div class="empty-state">
<h3>✨ Nenhum usuário bloqueado</h3>
<p>Você não bloqueou nenhum usuário ainda</p>
</div>
`;
return;
}

const bloqueados = snap.data().bloqueados;

for(const blockedId of bloqueados){
const blockedRef = doc(db,"usuarios",blockedId);
const blockedSnap = await getDoc(blockedRef);

if(!blockedSnap.exists()) continue;

const data = blockedSnap.data();

const item = document.createElement('div');
item.className = 'blocked-item';
item.innerHTML = `
<div class="blocked-user">
<img src="${data.foto || 'https://via.placeholder.com/55'}" class="blocked-avatar">
<div class="blocked-info">
<div class="blocked-name">${data.nome}</div>
<div class="blocked-username">@${data.usuario}</div>
</div>
</div>
<button class="btn-unblock" onclick="desbloquear('${blockedId}')">
✓ Desbloquear
</button>
`;

list.appendChild(item);
}
}

window.desbloquear = async (userId) => {
if(!confirm('Deseja desbloquear este usuário?')) return;

const userRef = doc(db,"usuarios",currentUser.uid);
await updateDoc(userRef,{bloqueados: arrayRemove(userId)});

alert('Usuário desbloqueado!');
loadBlockedUsers();
}
</script>

</body>
</html>
