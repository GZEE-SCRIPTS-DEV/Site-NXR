<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil - NXR</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#000;color:#fff;min-height:100vh;}

header{
display:flex;justify-content:space-between;align-items:center;
padding:20px;background:#111827;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
font-size:28px;font-weight:800;
background:linear-gradient(90deg,#c084fc,#60a5fa);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.btn-back{
padding:10px 15px;
background:#1f2937;
border-radius:10px;
color:white;
text-decoration:none;
}

/* PROFILE */
.container{max-width:900px;margin:auto;padding:20px;}

.banner{
height:220px;
border-radius:20px;
background:#111827;
overflow:hidden;
position:relative;
}

.banner img{width:100%;height:100%;object-fit:cover;}

.avatar{
width:120px;height:120px;border-radius:50%;
border:4px solid #000;
object-fit:cover;
position:absolute;
bottom:-60px;left:20px;
background:#222;
}

.info{
margin-top:70px;
}

.name{
font-size:28px;font-weight:800;
display:flex;gap:10px;align-items:center;
}

.user{
color:#9ca3af;
}

.bio{
margin-top:15px;
background:#111827;
padding:15px;
border-radius:15px;
}

.stats{
display:flex;gap:30px;margin-top:20px;
}

.stats div{
text-align:center;
}

.stats b{
font-size:22px;color:#c084fc;
}

.edit{
margin-top:30px;
background:#111827;
padding:20px;
border-radius:20px;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
background:#0f172a;
color:white;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:700;
cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<header>
<div class="logo">NXR</div>
<a class="btn-back" href="dashboard.html">← Voltar</a>
</header>

<div class="container">

<div class="banner">
<img id="bannerImg" src="">
<img id="avatarImg" class="avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
</div>

<div class="info">
<div class="name">
<span id="name">Carregando...</span>
</div>

<div class="user" id="user">@user</div>

<div class="bio" id="bio">...</div>

<div class="stats">
<div><b id="followers">0</b><p>Seguidores</p></div>
<div><b id="following">0</b><p>Seguindo</p></div>
</div>
</div>

<div class="edit" id="editBox">
<h3>Editar perfil</h3>

<input id="nameInput" placeholder="Nome">
<input id="userInput" placeholder="Usuário">
<textarea id="bioInput" placeholder="Bio"></textarea>

<input id="avatarInput" placeholder="URL da foto">
<input id="bannerInput" placeholder="URL do banner">

<button onclick="save()">Salvar</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
  authDomain: "siteoficialgzee.firebaseapp.com",
  projectId: "siteoficialgzee",
  storageBucket: "siteoficialgzee.firebasestorage.app",
  messagingSenderId: "927527396643",
  appId: "1:927527396643:web:e1de375c6994d351995896"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

const params = new URLSearchParams(window.location.search);
let perfilUid = params.get("uid");

function avatarPadrao(nome){
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(nome || "Usuario")}&background=7c3aed&color=fff`;
}

function bannerPadrao(){
  return "https://picsum.photos/1200/300";
}

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  if(!perfilUid){
    perfilUid = user.uid;
  }

  carregarPerfil(perfilUid);
});

async function carregarPerfil(uid){
  const ref = doc(db, "usuarios", uid);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    document.getElementById("displayName").textContent = "Usuário não encontrado";
    document.getElementById("displayUsername").textContent = "@erro";
    document.getElementById("displayBio").textContent = "Esse usuário não existe no Firestore.";
    return;
  }

  const u = snap.data();

  document.getElementById("displayName").textContent = u.nome || "Usuário";
  document.getElementById("displayUsername").textContent = "@" + (u.usuario || "user");
  document.getElementById("displayBio").textContent = u.bio || "Sem bio...";

  document.getElementById("avatarImg").src = u.foto || avatarPadrao(u.nome);

  const banner = document.getElementById("bannerImg");
  banner.src = u.banner || bannerPadrao();
  banner.style.display = "block";

  document.getElementById("followersCount").textContent = (u.seguidores || []).length;
  document.getElementById("followingCount").textContent = (u.seguindo || []).length;

  if(document.getElementById("postsCount")){
    document.getElementById("postsCount").textContent = "0";
  }

  document.getElementById("nameInput").value = u.nome || "";
  document.getElementById("usernameInput").value = u.usuario || "";
  document.getElementById("bioInput").value = u.bio || "";

  if(document.getElementById("fotoInput")){
    document.getElementById("fotoInput").value = u.foto || "";
  }

  if(document.getElementById("bannerInput")){
    document.getElementById("bannerInput").value = u.banner || "";
  }

  if(uid !== currentUser.uid){
    document.querySelector(".edit-section").style.display = "none";
  }
}

window.saveProfile = async()=>{
  const nome = document.getElementById("nameInput").value.trim();
  const usuario = document.getElementById("usernameInput").value.trim().replace("@","");
  const bio = document.getElementById("bioInput").value.trim();

  const fotoInput = document.getElementById("fotoInput");
  const bannerInput = document.getElementById("bannerInput");

  const foto = fotoInput ? fotoInput.value.trim() : "";
  const banner = bannerInput ? bannerInput.value.trim() : "";

  await updateDoc(doc(db, "usuarios", currentUser.uid), {
    nome,
    usuario,
    bio,
    foto,
    banner
  });

  alert("Perfil salvo!");
  location.reload();
};

</script>

</body>
</html>
