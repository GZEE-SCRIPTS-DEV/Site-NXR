<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil - NXR</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#000;color:#fff;min-height:100vh;}

header{
display:flex;justify-content:space-between;align-items:center;
padding:20px;background:#111827;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
font-size:28px;font-weight:800;
background:linear-gradient(90deg,#c084fc,#60a5fa);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.btn-back{
padding:10px 15px;
background:#1f2937;
border-radius:10px;
color:white;
text-decoration:none;
}

/* PROFILE */
.container{max-width:900px;margin:auto;padding:20px;}

.banner{
height:220px;
border-radius:20px;
background:#111827;
overflow:hidden;
position:relative;
}

.banner img{width:100%;height:100%;object-fit:cover;}

.avatar{
width:120px;height:120px;border-radius:50%;
border:4px solid #000;
object-fit:cover;
position:absolute;
bottom:-60px;left:20px;
background:#222;
}

.info{
margin-top:70px;
}

.name{
font-size:28px;font-weight:800;
display:flex;gap:10px;align-items:center;
}

.user{
color:#9ca3af;
}

.bio{
margin-top:15px;
background:#111827;
padding:15px;
border-radius:15px;
}

.stats{
display:flex;gap:30px;margin-top:20px;
}

.stats div{
text-align:center;
}

.stats b{
font-size:22px;color:#c084fc;
}

.edit{
margin-top:30px;
background:#111827;
padding:20px;
border-radius:20px;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
background:#0f172a;
color:white;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:700;
cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<header>
<div class="logo">NXR</div>
<a class="btn-back" href="dashboard.html">← Voltar</a>
</header>

<div class="container">

<div class="banner">
<img id="bannerImg" src="">
<img id="avatarImg" class="avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
</div>

<div class="info">
<div class="name">
<span id="name">Carregando...</span>
</div>

<div class="user" id="user">@user</div>

<div class="bio" id="bio">...</div>

<div class="stats">
<div><b id="followers">0</b><p>Seguidores</p></div>
<div><b id="following">0</b><p>Seguindo</p></div>
</div>
</div>

<div class="edit" id="editBox">
<h3>Editar perfil</h3>

<input id="nameInput" placeholder="Nome">
<input id="userInput" placeholder="Usuário">
<textarea id="bioInput" placeholder="Bio"></textarea>

<input id="avatarInput" placeholder="URL da foto">
<input id="bannerInput" placeholder="URL do banner">

<button onclick="save()">Salvar</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
authDomain: "siteoficialgzee.firebaseapp.com",
projectId: "siteoficialgzee"
});

const auth = getAuth(app);
const db = getFirestore(app);

let uidAtual = null;
let perfilUid = new URLSearchParams(location.search).get("uid");

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

uidAtual = user.uid;

if(!perfilUid) perfilUid = user.uid;

load(perfilUid);

});

async function load(uid){

const snap = await getDoc(doc(db,"usuarios",uid));
if(!snap.exists()) return;

const u = snap.data();

name.textContent = u.nome || "Sem nome";
user.textContent = "@" + (u.usuario || "user");
bio.textContent = u.bio || "Sem bio";

avatarImg.src = u.foto || avatarImg.src;
bannerImg.src = u.banner || "";

followers.textContent = (u.seguidores||[]).length;
following.textContent = (u.seguindo||[]).length;

if(uid !== uidAtual){
editBox.classList.add("hidden");
}

nameInput.value = u.nome || "";
userInput.value = u.usuario || "";
bioInput.value = u.bio || "";

}

window.save = async ()=>{

await updateDoc(doc(db,"usuarios",uidAtual),{
nome:nameInput.value,
usuario:userInput.value,
bio:bioInput.value,
foto:avatarInput.value,
banner:bannerInput.value
});

alert("Salvo!");
location.reload();

}

</script>

</body>
</html>
