<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - NXR</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}

.chat-container{display:flex;height:100vh;}

.chat-sidebar{
width:350px;background:#111827;border-right:1px solid rgba(255,255,255,0.05);
display:flex;flex-direction:column;
}

.chat-header{
padding:20px;background:#0f172a;border-bottom:1px solid rgba(255,255,255,0.05);
}

.chat-header h2{
font-size:24px;background:linear-gradient(90deg,#c084fc,#60a5fa);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.chat-search{
padding:15px;border-bottom:1px solid rgba(255,255,255,0.05);
}

.chat-search input{
width:100%;padding:12px 15px;background:rgba(15,23,42,0.8);
border:1px solid rgba(255,255,255,0.08);border-radius:12px;
color:white;font-size:14px;
}

.chat-search input:focus{outline:none;border-color:#7c3aed;}

.chat-list{flex:1;overflow-y:auto;padding:10px;}

.chat-item{
display:flex;align-items:center;gap:12px;padding:15px;
border-radius:12px;cursor:pointer;transition:0.2s;margin-bottom:5px;
}

.chat-item:hover{background:rgba(124,58,237,0.1);}
.chat-item.active{background:#7c3aed;}

.chat-item-avatar{
width:45px;height:45px;border-radius:50%;object-fit:cover;
border:2px solid #7c3aed;
}

.chat-item-info{flex:1;}
.chat-item-name{font-weight:700;font-size:15px;}
.chat-item-last{font-size:13px;color:#9ca3af;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.chat-main{flex:1;display:flex;flex-direction:column;background:#0a0a1e;}

.chat-main-header{
padding:20px 30px;background:#111827;border-bottom:1px solid rgba(255,255,255,0.05);
display:flex;align-items:center;justify-content:space-between;
}

.chat-main-user{display:flex;align-items:center;gap:12px;}
.chat-main-avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;border:2px solid #7c3aed;}
.chat-main-name{font-size:20px;font-weight:700;}

.chat-actions button{
padding:10px 18px;background:rgba(239,68,68,0.1);border:1px solid #ef4444;
border-radius:10px;color:#ef4444;font-weight:700;cursor:pointer;transition:0.3s;
}

.chat-actions button:hover{background:#ef4444;color:white;}

.chat-messages{flex:1;padding:30px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;}

.message{
max-width:70%;padding:15px 20px;border-radius:18px;font-size:15px;
line-height:1.5;word-wrap:break-word;
}

.message-sent{
align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#2563eb);
color:white;border-bottom-right-radius:5px;
}

.message-received{
align-self:flex-start;background:#111827;color:#e5e7eb;
border-bottom-left-radius:5px;
}

.message-time{font-size:11px;opacity:0.7;margin-top:5px;}

.chat-input-area{
padding:20px 30px;background:#111827;border-top:1px solid rgba(255,255,255,0.05);
display:flex;gap:12px;align-items:center;
}

.chat-input-area input{
flex:1;padding:15px 20px;background:rgba(15,23,42,0.8);
border:1px solid rgba(255,255,255,0.08);border-radius:25px;
color:white;font-size:15px;
}

.chat-input-area input:focus{outline:none;border-color:#7c3aed;}

.btn-send{
padding:15px 30px;background:linear-gradient(135deg,#7c3aed,#2563eb);
border:none;border-radius:25px;color:white;font-weight:700;
cursor:pointer;transition:0.3s;
}

.btn-send:hover{transform:scale(1.05);box-shadow:0 5px 20px rgba(124,58,237,0.4);}

.empty-state{
display:flex;flex-direction:column;align-items:center;justify-content:center;
height:100%;color:#6b7280;text-align:center;
}

.empty-state h3{font-size:24px;margin-bottom:10px;}

@media(max-width:768px){
.chat-sidebar{width:100px;}
.chat-item-info{display:none;}
}
</style>
</head>
<body>

<div class="chat-container">

<div class="chat-sidebar">
<div class="chat-header">
<h2>💬 Conversas</h2>
</div>

<div class="chat-search">
<input type="text" placeholder="🔍 Buscar contatos..." id="searchInput">
</div>

<div class="chat-list" id="chatList">
<!-- Conversas carregadas aqui -->
</div>
</div>

<div class="chat-main">

<div class="empty-state" id="emptyState">
<h3>👋 Selecione uma conversa</h3>
<p>Escolha um contato da lista para começar a conversar</p>
</div>

<div id="chatArea" style="display:none;flex:1;display:flex;flex-direction:column;">

<div class="chat-main-header">
<div class="chat-main-user">
<img src="https://via.placeholder.com/45" class="chat-main-avatar" id="chatAvatar">
<div class="chat-main-name" id="chatName">Nome</div>
</div>
<div class="chat-actions">
<button onclick="blockUser()">🚫 Bloquear</button>
</div>
</div>

<div class="chat-messages" id="chatMessages">
<!-- Mensagens aqui -->
</div>

<div class="chat-input-area">
<input type="text" placeholder="Digite sua mensagem..." id="messageInput" onkeypress="handleKey(event)">
<button class="btn-send" onclick="sendMessage()">Enviar</button>
</div>

</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,addDoc,orderBy,onSnapshot,doc,getDoc,updateDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
authDomain: "siteoficialgzee.firebaseapp.com",
projectId: "siteoficialgzee",
storageBucket: "siteoficialgzee.firebasestorage.app",
messagingSenderId: "927527396643",
appId: "1:927527396643:web:e1de375c6994d351995896"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let selectedChat = null;

onAuthStateChanged(auth, async (user) => {
if(!user){
window.location.href = "login.html";
return;
}
currentUser = user;
loadContacts();
});

async function loadContacts(){
const usersRef = collection(db,"usuarios");
const snap = await getDocs(usersRef);

const list = document.getElementById('chatList');
list.innerHTML = '';

snap.forEach(doc => {
if(doc.id === currentUser.uid) return;

const data = doc.data();
const item = document.createElement('div');
item.className = 'chat-item';
item.innerHTML = `
<img src="${data.foto || 'https://via.placeholder.com/45'}" class="chat-item-avatar">
<div class="chat-item-info">
<div class="chat-item-name">${data.nome}</div>
<div class="chat-item-last">Clique para conversar</div>
</div>
`;

item.onclick = () => openChat(doc.id, data);
list.appendChild(item);
});
}

function openChat(userId, userData){
selectedChat = userId;

document.getElementById('emptyState').style.display = 'none';
document.getElementById('chatArea').style.display = 'flex';

document.getElementById('chatName').textContent = userData.nome;
document.getElementById('chatAvatar').src = userData.foto || 'https://via.placeholder.com/45';

document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
event.currentTarget.classList.add('active');

loadMessages(userId);
}

async function loadMessages(userId){
const chatId = [currentUser.uid, userId].sort().join('_');
const messagesRef = collection(db,`chats/${chatId}/messages`);
const q = query(messagesRef, orderBy('timestamp','asc'));

onSnapshot(q, (snap) => {
const container = document.getElementById('chatMessages');
container.innerHTML = '';

snap.forEach(doc => {
const msg = doc.data();
const div = document.createElement('div');
div.className = msg.sender === currentUser.uid ? 'message message-sent' : 'message message-received';
div.innerHTML = `
<div>${msg.text}</div>
<div class="message-time">${new Date(msg.timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
`;
container.appendChild(div);
});

container.scrollTop = container.scrollHeight;
});
}

window.sendMessage = async () => {
const input = document.getElementById('messageInput');
const text = input.value.trim();

if(!text || !selectedChat) return;

const chatId = [currentUser.uid, selectedChat].sort().join('_');
const messagesRef = collection(db,`chats/${chatId}/messages`);

await addDoc(messagesRef,{
text,
sender: currentUser.uid,
timestamp: Date.now()
});

input.value = '';
}

window.handleKey = (e) => {
if(e.key === 'Enter') sendMessage();
}

window.blockUser = async () => {
if(!selectedChat) return;
if(!confirm('Deseja bloquear este usuário?')) return;

const userRef = doc(db,"usuarios",currentUser.uid);
await updateDoc(userRef,{
bloqueados: arrayUnion(selectedChat)
});

alert('Usuário bloqueado!');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
const search = e.target.value.toLowerCase();
document.querySelectorAll('.chat-item').forEach(item => {
const name = item.querySelector('.chat-item-name').textContent.toLowerCase();
item.style.display = name.includes(search) ? 'flex' : 'none';
});
});

</script>

</body>
</html>
