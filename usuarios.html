<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários - NXR</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:#000;color:#fff;min-height:100vh;}

header{
display:flex;justify-content:space-between;align-items:center;padding:20px 30px;
background:#111827;border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{font-size:30px;font-weight:800;background:linear-gradient(90deg,#c084fc,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.btn-back{
padding:10px 20px;background:rgba(124,58,237,0.1);border:1px solid #7c3aed;
border-radius:10px;color:#c084fc;font-weight:700;cursor:pointer;text-decoration:none;transition:0.3s;
}
.btn-back:hover{background:#7c3aed;color:white;}

.container{max-width:1200px;margin:0 auto;padding:40px 20px;}

.page-title{
font-size:42px;font-weight:800;margin-bottom:15px;
background:linear-gradient(90deg,#c084fc,#60a5fa);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.page-subtitle{font-size:18px;color:#9ca3af;margin-bottom:40px;}

.search-bar{
margin-bottom:40px;position:relative;
}

.search-bar input{
width:100%;padding:18px 60px 18px 24px;border-radius:20px;
border:1px solid rgba(255,255,255,0.08);background:rgba(17,24,39,0.8);
color:white;font-size:16px;transition:0.3s;
}

.search-bar input:focus{
outline:none;border-color:#7c3aed;box-shadow:0 0 30px rgba(124,58,237,0.3);
}

.search-icon{
position:absolute;right:24px;top:50%;transform:translateY(-50%);
font-size:24px;color:#9ca3af;pointer-events:none;
}

.users-grid{
display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:25px;
}

.user-card{
background:linear-gradient(135deg,rgba(17,24,39,0.98),rgba(2,6,23,0.98));
border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,0.05);
transition:0.3s;cursor:pointer;position:relative;overflow:hidden;
}

.user-card::before{
content:'';position:absolute;width:200px;height:200px;
background:radial-gradient(circle,#7c3aed,transparent);
filter:blur(60px);top:-80px;right:-80px;opacity:0;transition:0.3s;
}

.user-card:hover{
transform:translateY(-8px);border-color:#7c3aed;
box-shadow:0 15px 40px rgba(124,58,237,0.25);
}

.user-card:hover::before{opacity:0.2;}

.user-header{display:flex;align-items:center;gap:15px;margin-bottom:20px;}

.user-avatar{
width:70px;height:70px;border-radius:50%;object-fit:cover;
border:3px solid #7c3aed;
}

.user-info{flex:1;}

.user-name{
font-size:20px;font-weight:700;margin-bottom:4px;
display:flex;align-items:center;gap:8px;
}

.verified-badge{
width:18px;height:18px;background:#3b82f6;border-radius:50%;
display:inline-flex;align-items:center;justify-content:center;font-size:11px;
}

.user-username{font-size:14px;color:#9ca3af;}

.user-bio{
font-size:14px;color:#e5e7eb;line-height:1.6;margin-bottom:20px;
min-height:40px;
}

.user-stats{
display:flex;justify-content:space-around;margin-bottom:20px;
padding:15px 0;border-top:1px solid rgba(255,255,255,0.05);
border-bottom:1px solid rgba(255,255,255,0.05);
}

.stat-item{text-align:center;}
.stat-number{font-size:18px;font-weight:700;color:#c084fc;}
.stat-label{font-size:12px;color:#9ca3af;margin-top:3px;}

.user-actions{display:flex;gap:10px;}

.btn{
flex:1;padding:12px;border:none;border-radius:12px;
font-weight:700;cursor:pointer;transition:0.3s;font-size:14px;
}

.btn-primary{
background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;
}

.btn-primary:hover{transform:scale(1.05);box-shadow:0 5px 20px rgba(124,58,237,0.4);}

.btn-secondary{
background:rgba(239,68,68,0.1);border:1px solid #ef4444;color:#ef4444;
}

.btn-secondary:hover{background:#ef4444;color:white;}

.loading{
text-align:center;padding:60px 20px;color:#9ca3af;font-size:18px;
}

@media(max-width:768px){
.users-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
<div class="logo">NXR</div>
<a href="dashboard.html" class="btn-back">← Voltar</a>
</header>

<div class="container">

<h1 class="page-title">👥 Explorar Usuários</h1>
<p class="page-subtitle">Conecte-se com outros membros da comunidade</p>

<div class="search-bar">
<input type="text" id="searchInput" placeholder="Buscar usuários por nome ou @usuario...">
<span class="search-icon">🔍</span>
</div>

<div class="users-grid" id="usersGrid">
<div class="loading">⏳ Carregando usuários...</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,updateDoc,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
authDomain: "siteoficialgzee.firebaseapp.com",
projectId: "siteoficialgzee",
storageBucket: "siteoficialgzee.firebasestorage.app",
messagingSenderId: "927527396643",
appId: "1:927527396643:web:e1de375c6994d351995896"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentUserData = null;
let allUsers = [];

onAuthStateChanged(auth, async (user) => {
if(!user){
window.location.href = "login.html";
return;
}
currentUser = user;

const ref = doc(db,"usuarios",user.uid);
const snap = await getDoc(ref);
if(snap.exists()){
currentUserData = snap.data();
}

loadUsers();
});

async function loadUsers(){
const usersRef = collection(db,"usuarios");
const snap = await getDocs(usersRef);

const grid = document.getElementById('usersGrid');
grid.innerHTML = '';

allUsers = [];

snap.forEach(docSnap => {
if(docSnap.id === currentUser.uid) return;

const data = docSnap.data();
allUsers.push({id:docSnap.id,...data});

const isSeguindo = currentUserData?.seguindo?.includes(docSnap.id);
const isBloqueado = currentUserData?.bloqueados?.includes(docSnap.id);

if(isBloqueado) return;

const card = document.createElement('div');
card.className = 'user-card';
card.innerHTML = `
<div class="user-header">
<img src="${data.foto || 'https://via.placeholder.com/70'}" class="user-avatar">
<div class="user-info">
<div class="user-name">
${data.nome}
${data.verificado ? '<span class="verified-badge">✓</span>' : ''}
</div>
<div class="user-username">@${data.usuario}</div>
</div>
</div>

<div class="user-bio">${data.bio || 'Sem bio'}</div>

<div class="user-stats">
<div class="stat-item">
<div class="stat-number">${data.seguidores?.length || 0}</div>
<div class="stat-label">Seguidores</div>
</div>
<div class="stat-item">
<div class="stat-number">${data.seguindo?.length || 0}</div>
<div class="stat-label">Seguindo</div>
</div>
</div>

<div class="user-actions">
<button class="btn btn-primary" onclick="toggleSeguir('${docSnap.id}')" id="btn-${docSnap.id}">
${isSeguindo ? '✓ Seguindo' : '+ Seguir'}
</button>
<button class="btn btn-secondary" onclick="bloquearUsuario('${docSnap.id}')">
🚫 Bloquear
</button>
</div>
`;

grid.appendChild(card);
});

if(grid.children.length === 0){
grid.innerHTML = '<div class="loading">Nenhum usuário encontrado</div>';
}
}

window.toggleSeguir = async (userId) => {
const userRef = doc(db,"usuarios",currentUser.uid);
const targetRef = doc(db,"usuarios",userId);

const isSeguindo = currentUserData?.seguindo?.includes(userId);

if(isSeguindo){
await updateDoc(userRef,{seguindo: arrayRemove(userId)});
await updateDoc(targetRef,{seguidores: arrayRemove(currentUser.uid)});
currentUserData.seguindo = currentUserData.seguindo.filter(id => id !== userId);
document.getElementById(`btn-${userId}`).textContent = '+ Seguir';
}else{
await updateDoc(userRef,{seguindo: arrayUnion(userId)});
await updateDoc(targetRef,{seguidores: arrayUnion(currentUser.uid)});
if(!currentUserData.seguindo) currentUserData.seguindo = [];
currentUserData.seguindo.push(userId);
document.getElementById(`btn-${userId}`).textContent = '✓ Seguindo';
}
}

window.bloquearUsuario = async (userId) => {
if(!confirm('Deseja bloquear este usuário?')) return;

const userRef = doc(db,"usuarios",currentUser.uid);
await updateDoc(userRef,{bloqueados: arrayUnion(userId)});

if(!currentUserData.bloqueados) currentUserData.bloqueados = [];
currentUserData.bloqueados.push(userId);

alert('Usuário bloqueado!');
loadUsers();
}

document.getElementById('searchInput').addEventListener('input', (e) => {
const search = e.target.value.toLowerCase();
document.querySelectorAll('.user-card').forEach(card => {
const text = card.textContent.toLowerCase();
card.style.display = text.includes(search) ? 'block' : 'none';
});
});
</script>

</body>
</html>
