<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - NXR</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
display:flex;justify-content:center;align-items:center;min-height:100vh;
background:#000;color:white;position:relative;overflow:hidden;
}

body::before{
content:'';position:absolute;width:100%;height:100%;
background:radial-gradient(circle at 30% 50%,#7c3aed 0%,transparent 50%),radial-gradient(circle at 70% 50%,#2563eb 0%,transparent 50%);
opacity:0.2;animation:pulse 15s ease-in-out infinite;
}

@keyframes pulse{0%,100%{opacity:0.2;}50%{opacity:0.35;}}

.login-container{
position:relative;z-index:1;width:420px;padding:50px 40px;
background:linear-gradient(135deg,rgba(17,24,39,0.95),rgba(2,6,23,0.95));
border-radius:30px;border:1px solid rgba(255,255,255,0.08);
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.logo{
text-align:center;font-size:42px;font-weight:900;margin-bottom:10px;
background:linear-gradient(90deg,#c084fc,#60a5fa);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.subtitle{text-align:center;color:#9ca3af;margin-bottom:40px;font-size:15px;}

.form-group{margin-bottom:20px;}

.form-group label{display:block;margin-bottom:8px;color:#e5e7eb;font-weight:600;font-size:14px;}

.form-group input{
width:100%;padding:15px 20px;border-radius:15px;border:1px solid rgba(255,255,255,0.08);
background:rgba(15,23,42,0.8);color:white;font-size:15px;transition:0.3s;
}

.form-group input:focus{
outline:none;border-color:#7c3aed;
box-shadow:0 0 20px rgba(124,58,237,0.3);
}

.btn{
width:100%;padding:16px;border:none;border-radius:15px;
font-size:16px;font-weight:700;cursor:pointer;transition:0.3s;margin-top:10px;
}

.btn-primary{
background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;
box-shadow:0 10px 30px rgba(124,58,237,0.4);
}

.btn-primary:hover{
transform:translateY(-2px);
box-shadow:0 15px 40px rgba(124,58,237,0.6);
}

.btn-google{
background:white;color:#000;display:flex;align-items:center;
justify-content:center;gap:12px;font-weight:700;
}

.btn-google:hover{
background:#f5f5f5;transform:translateY(-2px);
box-shadow:0 10px 30px rgba(255,255,255,0.2);
}

.btn-google img{width:20px;height:20px;}

.divider{
display:flex;align-items:center;margin:25px 0;color:#888;font-size:14px;
}

.divider::before,.divider::after{
content:"";flex:1;height:1px;background:rgba(255,255,255,0.1);
}

.divider span{padding:0 15px;color:#9ca3af;}

.switch{
text-align:center;margin-top:25px;font-size:14px;color:#9ca3af;cursor:pointer;
}

.switch span{color:#7c3aed;font-weight:700;}
.switch:hover span{text-decoration:underline;}

.error-msg{
display:none;padding:12px;border-radius:10px;
background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
color:#ef4444;font-size:14px;margin-bottom:15px;
}

@media(max-width:500px){
.login-container{width:90%;padding:40px 30px;}
}
</style>
</head>
<body>

<div class="login-container">

<div class="logo">NXR</div>
<p class="subtitle" id="subtitle">Entre na sua conta</p>

<div class="error-msg" id="errorMsg"></div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" placeholder="seu@email.com">
</div>

<div class="form-group">
<label>Senha</label>
<input type="password" id="senha" placeholder="••••••••">
</div>

<button class="btn btn-primary" id="mainBtn" onclick="handleAuth()">ENTRAR</button>

<div class="divider"><span>ou</span></div>

<button class="btn btn-google" onclick="loginGoogle()">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
Continuar com Google
</button>

<div class="switch" onclick="toggleMode()">
<span id="switchText">Não tem conta? Criar conta</span>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
authDomain: "siteoficialgzee.firebaseapp.com",
projectId: "siteoficialgzee",
storageBucket: "siteoficialgzee.firebasestorage.app",
messagingSenderId: "927527396643",
appId: "1:927527396643:web:e1de375c6994d351995896"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let mode = "login";

function showError(msg){
const el = document.getElementById('errorMsg');
el.textContent = msg;
el.style.display = 'block';
setTimeout(() => el.style.display = 'none', 5000);
}

async function criarUsuarioSeNaoExistir(user){
const ref = doc(db,"usuarios",user.uid);
const snap = await getDoc(ref);
if(!snap.exists()){
await setDoc(ref,{
nome: user.displayName || "Usuário",
usuario: (user.email || "user").split("@")[0],
foto: user.photoURL || "",
banner: "",
bio: "Olá! Estou usando NXR Aliança 🚀",
verificado: false,
seguidores: [],
seguindo: [],
bloqueados: [],
criadoEm: new Date().toISOString()
});
}
}

window.handleAuth = async () => {
const email = document.getElementById("email").value.trim();
const senha = document.getElementById("senha").value;

if(!email || !senha){
showError("Preencha todos os campos!");
return;
}

try{
if(mode === "login"){
const res = await signInWithEmailAndPassword(auth,email,senha);
await criarUsuarioSeNaoExistir(res.user);
}else{
if(senha.length < 6){
showError("A senha deve ter no mínimo 6 caracteres!");
return;
}
const res = await createUserWithEmailAndPassword(auth,email,senha);
await criarUsuarioSeNaoExistir(res.user);
}
window.location.href = "dashboard.html";
}catch(e){
let msg = "Erro ao autenticar!";
if(e.code === 'auth/user-not-found') msg = "Usuário não encontrado!";
if(e.code === 'auth/wrong-password') msg = "Senha incorreta!";
if(e.code === 'auth/email-already-in-use') msg = "Email já cadastrado!";
if(e.code === 'auth/invalid-email') msg = "Email inválido!";
showError(msg);
}
}

window.loginGoogle = async () => {

try{

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
prompt:"select_account"
});

const res = await signInWithPopup(auth,provider);

await criarUsuarioSeNaoExistir(res.user);

window.location.href = "dashboard.html";

}catch(e){

console.log(e);

if(e.code === "auth/popup-closed-by-user"){
showError("Login cancelado!");
return;
}

if(e.code === "auth/unauthorized-domain"){
showError("Domínio não autorizado no Firebase!");
return;
}

if(e.code === "auth/popup-blocked"){
showError("O navegador bloqueou o popup!");
return;
}

showError(e.message);

}

}
  
window.toggleMode = () => {
mode = mode === "login" ? "cadastro" : "login";
if(mode === "login"){
document.getElementById("subtitle").innerText = "Entre na sua conta";
document.getElementById("mainBtn").innerText = "ENTRAR";
document.getElementById("switchText").innerHTML = "Não tem conta? <span style='color:#7c3aed;font-weight:700'>Criar conta</span>";
}else{
document.getElementById("subtitle").innerText = "Crie sua conta grátis";
document.getElementById("mainBtn").innerText = "CADASTRAR";
document.getElementById("switchText").innerHTML = "Já tem conta? <span style='color:#7c3aed;font-weight:700'>Entrar</span>";
}
}

document.getElementById('email').addEventListener('keypress', e => {
if(e.key === 'Enter') handleAuth();
});
document.getElementById('senha').addEventListener('keypress', e => {
if(e.key === 'Enter') handleAuth();
});

</script>

</body>
</html>
