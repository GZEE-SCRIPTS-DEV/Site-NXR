<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NXR Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b0f19;
color:white;
display:flex;
min-height:100vh;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#111827;
padding:20px;
display:flex;
flex-direction:column;
border-right:1px solid rgba(255,255,255,0.05);
}

.logo{
font-size:32px;
font-weight:800;
color:#a855f7;
margin-bottom:40px;
}

.sidebar button{
width:100%;
padding:15px;
margin-bottom:12px;
border:none;
border-radius:14px;
background:#1f2937;
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.2s;
text-align:left;
}

.sidebar button:hover{
background:#7c3aed;
transform:translateX(4px);
}

.sidebar button.active{
background:#7c3aed;
}

/* MAIN */

.main{
flex:1;
overflow-y:auto;
height:100vh;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#111827;
border-bottom:1px solid rgba(255,255,255,0.05);
position:sticky;
top:0;
z-index:999;
}

.header h1{
font-size:28px;
}

.profile-btn{
padding:12px 18px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
font-weight:700;
cursor:pointer;
}

/* SECTIONS */

.section{
display:none;
padding:20px;
}

.section.active{
display:block;
}

/* USERS */

.users-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.user-card{
background:#111827;
padding:20px;
border-radius:20px;
cursor:pointer;
transition:.2s;
border:1px solid rgba(255,255,255,0.05);
}

.user-card:hover{
transform:translateY(-4px);
}

.user-banner{
width:100%;
height:120px;
border-radius:14px;
object-fit:cover;
}

.user-photo{
width:90px;
height:90px;
border-radius:50%;
margin-top:-45px;
border:5px solid #111827;
object-fit:cover;
background:#222;
}

.user-name{
margin-top:10px;
font-size:22px;
font-weight:700;
display:flex;
align-items:center;
gap:6px;
}

.user-user{
color:#9ca3af;
margin-top:4px;
}

.user-stats{
display:flex;
gap:20px;
margin-top:15px;
}

/* BADGES */

.verified{
width:18px;
height:18px;
border-radius:50%;
background:#3b82f6;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}

.beta{
width:18px;
height:18px;
border-radius:50%;
background:#f59e0b;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
}

/* FEED */

.create-post{
background:#111827;
padding:20px;
border-radius:20px;
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:20px;
}

.create-post textarea,
.create-post input{
background:#0f172a;
border:none;
padding:15px;
border-radius:14px;
color:white;
outline:none;
}

.create-post button{
padding:15px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-weight:700;
cursor:pointer;
}

.post{
background:#111827;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
border:1px solid rgba(255,255,255,0.05);
}

.post-header{
display:flex;
align-items:center;
gap:12px;
padding:15px;
}

.post-photo{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.post-media{
width:100%;
max-height:600px;
object-fit:cover;
background:black;
}

.post-caption{
padding:15px;
color:#d1d5db;
}

.post-actions{
display:flex;
gap:10px;
padding:15px;
}

.post-actions button{
flex:1;
padding:14px;
border:none;
border-radius:14px;
background:#0f172a;
color:white;
font-weight:700;
cursor:pointer;
}

/* CHAT */

.chat-box{
background:#111827;
height:70vh;
border-radius:20px;
padding:20px;
overflow-y:auto;
}

.chat-message{
background:#0f172a;
padding:12px;
border-radius:14px;
margin-bottom:12px;
}

.chat-send{
display:flex;
gap:10px;
margin-top:15px;
}

.chat-send input{
flex:1;
padding:15px;
border:none;
border-radius:14px;
background:#111827;
color:white;
outline:none;
}

.chat-send button{
padding:15px 20px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-weight:700;
cursor:pointer;
}

/* PROFILE */

.profile-card{
background:#111827;
border-radius:20px;
overflow:hidden;
}

.profile-banner{
width:100%;
height:250px;
object-fit:cover;
}

.profile-content{
padding:20px;
text-align:center;
}

.profile-photo{
width:120px;
height:120px;
border-radius:50%;
margin-top:-70px;
border:5px solid #111827;
object-fit:cover;
background:#222;
}

.profile-name{
font-size:30px;
font-weight:800;
margin-top:10px;
}

.profile-user{
color:#9ca3af;
margin-top:4px;
}

.profile-stats{
display:flex;
justify-content:center;
gap:40px;
margin-top:20px;
}

.profile-stats div{
text-align:center;
}

.profile-stats b{
font-size:22px;
}

.profile-edit{
margin-top:20px;
padding:14px 20px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-weight:700;
cursor:pointer;
}

/* RESPONSIVO */

@media screen and (max-width:900px){

body{
flex-direction:column;
overflow:auto;
}

.sidebar{
width:100%;
height:auto;
flex-direction:row;
overflow-x:auto;
padding:12px;
gap:10px;
border-right:none;
border-bottom:1px solid rgba(255,255,255,0.05);
position:sticky;
top:0;
z-index:999;
}

.logo{
display:none;
}

.sidebar button{
min-width:170px;
margin-bottom:0;
text-align:center;
}

.main{
height:auto;
overflow:visible;
}

.users-grid{
grid-template-columns:1fr;
}

.chat-send{
flex-direction:column;
}

.post-actions{
flex-direction:column;
}

.profile-stats{
gap:20px;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">NXR</div>

<button class="menu-btn active" data-section="dashboard">
🏠 Dashboard
</button>

<button class="menu-btn" data-section="usuarios">
👥 Usuários
</button>

<button class="menu-btn" data-section="feed">
📸 Feed
</button>

<button class="menu-btn" data-section="chat">
💬 Chat Global
</button>

<button class="menu-btn" data-section="perfil">
⚙️ Perfil
</button>

</div>

<!-- MAIN -->

<div class="main">

<!-- HEADER -->

<div class="header">

<h1>NXR Dashboard</h1>

<button class="profile-btn"
onclick="window.location.href='perfil.html'">
Meu Perfil
</button>

</div>

<!-- DASHBOARD -->

<div class="section active" id="dashboard-section">

<h2>Bem-vindo à NXR</h2>

<br>

<p>
Sistema completo com usuários, chat,
feed, perfil e comunidade.
</p>

</div>

<!-- USERS -->

<div class="section" id="usuarios-section">

<h2>Usuários</h2>

<br>

<div class="users-grid" id="users"></div>

</div>

<!-- FEED -->

<div class="section" id="feed-section">

<div class="create-post">

<textarea
id="caption"
placeholder="O que você quer postar?"></textarea>

<input
type="text"
id="media"
placeholder="Cole link da imagem ou vídeo">

<button onclick="criarPost()">
Postar
</button>

</div>

<div id="feed"></div>

</div>

<!-- CHAT -->

<div class="section" id="chat-section">

<div class="chat-box" id="chatMessages"></div>

<div class="chat-send">

<input
type="text"
id="chatInput"
placeholder="Digite sua mensagem">

<button onclick="enviarMensagem()">
Enviar
</button>

</div>

</div>

<!-- PERFIL -->

<div class="section" id="perfil-section">

<div class="profile-card">

<img
id="perfilBanner"
class="profile-banner"
src="https://picsum.photos/1200/300">

<div class="profile-content">

<img
id="perfilFoto"
class="profile-photo"
src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

<div
class="profile-name"
id="perfilNome">
Usuário
</div>

<div
class="profile-user"
id="perfilUser">
@user
</div>

<div class="profile-stats">

<div>
<b id="seguidores">0</b>
<p>Seguidores</p>
</div>

<div>
<b id="seguindo">0</b>
<p>Seguindo</p>
</div>

</div>

<button
class="profile-edit"
onclick="window.location.href='editarperfil.html'">
Editar Perfil
</button>

</div>

</div>

</div>

</div>

<script type="module">

/* FIREBASE */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
query,
orderBy,
doc,
getDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyDmuDzQBWi9G1DculuOy69v3BH0ulhUwcM",
authDomain: "siteoficialgzee.firebaseapp.com",
projectId: "siteoficialgzee",
storageBucket: "siteoficialgzee.firebasestorage.app",
messagingSenderId: "927527396643",
appId: "1:927527396643:web:e1de375c6994d351995896"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let me = null;

/* LOGIN */

onAuthStateChanged(auth, async(user)=>{

if(user){

me = user.uid;

loadUsers();

loadFeed();

loadChat();

loadPerfil();

}else{

window.location.href = "login.html";

}

});

/* USERS */

async function loadUsers(){

const div =
document.getElementById("users");

div.innerHTML = "";

const snap =
await getDocs(collection(db,"usuarios"));

snap.forEach(docSnap=>{

const u = docSnap.data();

const uid = docSnap.id;

div.innerHTML += `

<div class="user-card"
onclick="window.location.href='perfil.html?uid=${uid}'">

<img
class="user-banner"
src="${u.banner || 'https://picsum.photos/500/200'}">

<img
class="user-photo"
src="${u.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">

<div class="user-name">

${u.nome || "Usuário"}

${u.verificado
? '<span class="verified">✔</span>'
: ''}

${u.betaTester
? '<span class="beta">⚒️</span>'
: ''}

</div>

<div class="user-user">
@${u.usuario || "user"}
</div>

<div class="user-stats">

<div>
<b>${(u.seguidores || []).length}</b>
<p>Seguidores</p>
</div>

<div>
<b>${(u.seguindo || []).length}</b>
<p>Seguindo</p>
</div>

</div>

</div>

`;

});

}

/* POSTS */

window.criarPost = async()=>{

if(!me) return;

const legenda =
document.getElementById("caption").value;

const media =
document.getElementById("media").value;

if(!media) return;

const tipo =
media.includes(".mp4")
? "video"
: "imagem";

await addDoc(collection(db,"posts"),{

uid:me,
legenda,
media,
tipo,
timestamp:Date.now(),
likes:[]

});

document.getElementById("caption").value="";
document.getElementById("media").value="";

loadFeed();

};

/* LOAD FEED */

async function loadFeed(){

const feed =
document.getElementById("feed");

feed.innerHTML = "";

const q =
query(
collection(db,"posts"),
orderBy("timestamp","desc")
);

const snap =
await getDocs(q);

for(const docSnap of snap.docs){

const p = docSnap.data();

const userSnap =
await getDoc(doc(db,"usuarios",p.uid));

const u =
userSnap.exists()
? userSnap.data()
: {};

feed.innerHTML += `

<div class="post">

<div class="post-header">

<img
class="post-photo"
src="${u.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">

<div>

<b>${u.nome || 'Usuário'}</b>

<div style="color:#9ca3af;">
@${u.usuario || 'user'}
</div>

</div>

</div>

${
p.tipo==="video"

?

`<video
class="post-media"
src="${p.media}"
controls></video>`

:

`<img
class="post-media"
src="${p.media}">`

}

<div class="post-caption">
${p.legenda || ""}
</div>

<div class="post-actions">

<button>
❤️ ${p.likes?.length || 0}
</button>

<button>
💬 Comentários
</button>

</div>

</div>

`;

}

}

/* CHAT */

function loadChat(){

const div =
document.getElementById("chatMessages");

onSnapshot(

query(
collection(db,"chat"),
orderBy("timestamp","asc")
),

(snapshot)=>{

div.innerHTML = "";

snapshot.forEach(docSnap=>{

const m = docSnap.data();

div.innerHTML += `

<div class="chat-message">

<b>${m.nome}</b>

<p>${m.texto}</p>

</div>

`;

});

div.scrollTop = div.scrollHeight;

});

}

/* ENVIAR MENSAGEM */

window.enviarMensagem = async()=>{

const texto =
document.getElementById("chatInput").value;

if(!texto) return;

const userSnap =
await getDoc(doc(db,"usuarios",me));

const u = userSnap.data();

await addDoc(collection(db,"chat"),{

uid:me,
nome:u.nome || "Usuário",
texto,
timestamp:Date.now()

});

document.getElementById("chatInput").value="";

};

/* PERFIL */

async function loadPerfil(){

const snap =
await getDoc(doc(db,"usuarios",me));

if(!snap.exists()) return;

const u = snap.data();

document.getElementById("perfilBanner").src =
u.banner || "https://picsum.photos/1200/300";

document.getElementById("perfilFoto").src =
u.foto || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

document.getElementById("perfilNome").innerText =
u.nome || "Usuário";

document.getElementById("perfilUser").innerText =
"@" + (u.usuario || "user");

document.getElementById("seguidores").innerText =
(u.seguidores || []).length;

document.getElementById("seguindo").innerText =
(u.seguindo || []).length;

}

/* MENU */

document.querySelectorAll(".menu-btn")
.forEach(btn=>{

btn.onclick = ()=>{

document.querySelector(".menu-btn.active")
.classList.remove("active");

btn.classList.add("active");

document.querySelectorAll(".section")
.forEach(sec=>{

sec.classList.remove("active");

});

document
.getElementById(btn.dataset.section + "-section")
.classList.add("active");

};

});

</script>

</body>
</html>
